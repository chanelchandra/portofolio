<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="java.js" defer></script>
    <title>Chanel Chandra</title>
</head>

<body onload="startTime()">

    <div class="main-wrapper">
        <!-- SECTION 1: HOME Screen -->
         <section class="home-screen">

            <div class="drop-down-trigger" onclick="unlock()">
                <div class="arrow-icon"></div>
            </div>


            <div class="phone-apps">
                <div class="phone-row" id="row1">
                    <div class="app" id="photos"></div>
                    <div class="app" id="notes"></div>
                    <div class="app" id="spotify"></div>
                    <div class="app" id="drive"></div>
                </div>
                <div class="widget1"></div>
                <div class="phone-row" id="row2">
                    <div class="app" id="maps"></div>
                    <div class="app" id="instagram"></div>
                    <div class="app" id="calculator"></div>
                    <div class="app" id="translate"></div>
                </div>
                <div class="widget2"></div>
            </div>

            
            <div class="tab-apps">
                <div class="tab-row" id="row1">
                    <div class="widget2"></div>
                    <div class="tab-app-row" id="approw1">
                        <div class="app" id="photos"></div>
                        <div class="app" id="notes"></div>
                        <div class="app" id="spotify"></div>
                        <div class="app" id="drive"></div>
                    </div>
                </div>
                <div class="widget1"></div>
                <div class="tab-app-row" id="approw2">
                    <div class="app" id="maps"></div>
                    <div class="app" id="instagram"></div>
                </div>
                <div class="tab-app-row" id="approw3">
                    <div class="app" id="calculator"></div>
                    <div class="app" id="translate"></div>
                </div>
            </div>


        </section>

        <!-- SECTION 2: Home Screen (homescreen content) -->
        <section class="lock-screen" id ="lock-screen">

            <div class="container-date">
                <div id="date"></div>
                <div id="clock"></div>
            </div>
            <div class="horizontal-line"></div> <!--rounded line -->

        </section>
        
    </div>
    
</body>
</html>
